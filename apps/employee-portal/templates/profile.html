{% extends "base.html" %}

{% block title %}
Profile | NovaSecure Employee Portal
{% endblock %}

{% block content %}
<section>
    <h1>My Profile</h1>

    <dl class="profile-details">
        <dt>Name</dt>
        <dd>{{ user.name }}</dd>

        <dt>Username</dt>
        <dd>{{ user.username }}</dd>

        <dt>Email</dt>
        <dd>{{ user.email }}</dd>

        <dt>OIDC Subject</dt>
        <dd>{{ user.id }}</dd>
    </dl>
</section>
{% endblock %}
