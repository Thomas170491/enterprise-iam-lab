<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        NovaSecure Employee Portal
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<header class="site-header">

    <nav class="main-nav">

        <a
            class="nav-brand"
            href="{{ url_for('portal.home') }}"
        >
            <span class="brand-mark">N</span>

            <span class="brand-text">
                NovaSecure
                <small>Employee Portal</small>
            </span>
        </a>


        {% if current_user.is_authenticated %}

        <div class="nav-links">

            <a href="{{ url_for('portal.home') }}">
                Home
            </a>

            <a href="{{ url_for('portal.profile') }}">
                Profile
            </a>

            <a href="{{ url_for('portal.department') }}">
                Department
            </a>

            {% if "manager-dashboard" in current_user.client_roles %}

            <a href="{{ url_for('portal.manager') }}">
                Manager
            </a>

            {% endif %}

        </div>


        <div class="nav-account">

            <span class="nav-user">
                {{ current_user.name or current_user.username }}
            </span>

            <form
                method="POST"
                action="{{ url_for('auth.logout') }}"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <button
                    class="logout-button"
                    type="submit"
                >
                    Log out
                </button>

            </form>

        </div>


        {% else %}

        <a
            class="nav-signin"
            href="{{ url_for('auth.login') }}"
        >
            Sign in
        </a>

        {% endif %}

    </nav>

</header>


<main>
    {% block content %}
    {% endblock %}
</main>

</body>

</html>
