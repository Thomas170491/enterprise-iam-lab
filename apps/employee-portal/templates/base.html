<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        NovaSecure Employee Portal
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header>
        <nav>

            <a href="{{ url_for('portal.home') }}">
                NovaSecure
            </a>

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('portal.profile') }}">
                    Profile
                </a>

                <a href="{{ url_for('portal.department') }}">
                    Department
                </a>

                {% if "manager-dashboard" in current_user.client_roles %}
                    <a href="{{ url_for('portal.manager') }}">
                        Manager Dashboard
                    </a>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.logout') }}">
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button type="submit">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{{ url_for('auth.login') }}">
                    Sign in
                </a>

            {% endif %}

        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
